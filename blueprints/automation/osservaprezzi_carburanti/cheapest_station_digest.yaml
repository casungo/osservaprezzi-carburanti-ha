blueprint:
  name: Cheapest station digest
  description: Send a scheduled digest of the cheapest configured fuel stations.
  domain: automation
  input:
    notify_action:
      name: Notification action
      description: Use {{ message }} as the notification message.
      selector:
        action: {}
    time:
      name: Time
      default: '08:00:00'
      selector:
        time: {}
    weekdays:
      name: Weekdays
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    fuel_type:
      name: Fuel type (empty for all)
      default: ''
      selector:
        text: {}
    service_mode:
      name: Service mode
      default: any
      selector:
        select:
          options: [any, self, served]
    only_open:
      name: Only open stations
      default: false
      selector:
        boolean: {}
    exclude_stale:
      name: Exclude stale prices
      default: false
      selector:
        boolean: {}
    liters:
      name: Liters
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          mode: box
trigger:
  - platform: time
    at: !input time
condition:
  - condition: time
    weekday: !input weekdays
action:
  - variables:
      fuel_type: !input fuel_type
      service_mode: !input service_mode
      only_open: !input only_open
      exclude_stale: !input exclude_stale
      liters: !input liters
  - action: osservaprezzi_carburanti.compare_stations
    data:
      fuel_type: '{{ fuel_type }}'
      service_mode: '{{ service_mode }}'
      only_open: '{{ only_open }}'
      exclude_stale: '{{ exclude_stale }}'
      liters: '{{ liters }}'
    response_variable: response
  - variables:
      message: >-
        {% for station in response.ranking %}
        {{ loop.index }}. {{ station.station_name }}: {{ station.price }} €/L
        {% else %}
        No matching station prices.
        {% endfor %}
  - choose: []
    default: !input notify_action
mode: single
