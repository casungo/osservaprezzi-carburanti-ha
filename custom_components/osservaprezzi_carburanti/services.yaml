force_csv_update:
  name: Force CSV update
  description: Forces an immediate download and refresh of the CSV station database for all configured stations.
clear_cache:
  name: Clear CSV cache
  description: Clears the cached CSV station data and re-downloads a fresh copy.
compare_stations:
  name: Compare station prices
  description: Returns a comparison and sorted ranking of fuel prices across configured stations.
  fields:
    fuel_type:
      name: Fuel type
      description: Optional fuel name or key filter (case-insensitive).
      required: false
      selector:
        text:
    service_mode:
      name: Service mode
      description: Filter by self-service or served prices.
      required: false
      default: any
      selector:
        select:
          options:
            - any
            - self
            - served
    exclude_stale:
      name: Exclude stale prices
      required: false
      default: false
      selector:
        boolean:
    only_open:
      name: Only open stations
      required: false
      default: false
      selector:
        boolean:
    liters:
      name: Liters
      description: Optional refuel volume to calculate estimated total cost and savings.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    sort_by:
      name: Sort by
      required: false
      default: price
      selector:
        select:
          options:
            - price
            - distance
    latitude:
      name: Latitude
      required: false
      selector:
        number:
          min: -90
          max: 90
          mode: box
    longitude:
      name: Longitude
      required: false
      selector:
        number:
          min: -180
          max: 180
          mode: box
    zone:
      name: Zone
      required: false
      selector:
        entity:
          filter:
            domain: zone
refresh_prices:
  name: Refresh fuel prices
  description: Refreshes all active stations, or only the requested stations, devices, or entities.
  fields:
    device_id:
      name: Stations (devices)
      description: Optional station devices to refresh.
      required: false
      selector:
        device:
          integration: osservaprezzi_carburanti
          multiple: true
    entity_id:
      name: Station entities
      description: Optional station entities whose stations should be refreshed.
      required: false
      selector:
        entity:
          integration: osservaprezzi_carburanti
          multiple: true
    station_ids:
      name: Station IDs
      description: Optional list of configured Osservaprezzi station IDs to refresh.
      required: false
      example:
        - "54233"
        - "54234"
      selector:
        text:
          multiple: true
search_registry:
  name: Search station registry
  description: Searches the locally cached official registry and returns matching stations.
  fields:
    query:
      name: Text
      description: Optional text found in the name, brand, address, operator, municipality, or province.
      required: false
      selector:
        text:
    municipality:
      name: Municipality
      description: Optional municipality name or fragment.
      required: false
      selector:
        text:
    province:
      name: Province
      description: Optional province name, abbreviation, or fragment.
      required: false
      selector:
        text:
    station_type:
      name: Station type
      description: Optional station type or fragment.
      required: false
      selector:
        text:
    limit:
      name: Maximum results
      description: Maximum number of stations to return.
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 50
          mode: box
    latitude:
      name: Latitude
      selector:
        number:
          min: -90
          max: 90
          mode: box
    longitude:
      name: Longitude
      selector:
        number:
          min: -180
          max: 180
          mode: box
    radius_km:
      name: Radius (km)
      default: 5.0
      selector:
        number:
          min: 0.1
          max: 20000
          mode: box
    zone:
      name: Zone
      selector:
        entity:
          filter:
            domain: zone
